<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nazifoski Preventivi</title>
<meta name="description" content="Preventivi dell'Impresa Edile Nazifoski">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1F23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nazifoski">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="js/app.js">
<style>
/* Layout: testata con logo; su telefono barra delle sezioni in basso e schede a tutta larghezza;
   su computer colonna centrale da 1100px con schede in alto. Colori e caratteri di nazifoski.it. */
@font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500; font-display: swap; src: url(fonts/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 500; font-display: swap; src: url(fonts/space-grotesk-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 700; font-display: swap; src: url(fonts/space-grotesk-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }

:root {
  --paper: #F4F2ED; --paper-alt: #ECE8DF; --card: #FFFFFF; --ink: #1C1A17; --ink-soft: #55504A; --stone: #6B6862;
  --line: #D8D3C9; --line-soft: #E7E3DA; --blue: #2E4A6B; --blue-deep: #1C3350; --blue-tint: #E6ECF2; --on-blue: #FFFFFF;
  --walnut: #5B4636; --ok: #2F6B45; --ok-tint: #E3EFE6; --warn: #8A5A12; --warn-tint: #F5EAD6; --bad: #9A3324; --bad-tint: #F4E1DD;
  --press: rgba(28, 26, 23, .06); --shadow: 0 1px 2px rgba(28,26,23,.06), 0 8px 24px rgba(28,26,23,.08); --scrim: rgba(20,18,15,.48);
  --logo-light: block; --logo-dark: none;
  --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 12px; --fast: 150ms; --ease: cubic-bezier(.2, .7, .2, 1);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --nav-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121416; --paper-alt: #1A1D20; --card: #1C1F23; --ink: #ECE8DF; --ink-soft: #B8B2A8; --stone: #9C968C;
    --line: #33383E; --line-soft: #282C31; --blue: #8FB0D6; --blue-deep: #B9CFE8; --blue-tint: #1E2A38; --on-blue: #0E1621;
    --walnut: #C9A88C; --ok: #7CC495; --ok-tint: #1B2C21; --warn: #E2B66A; --warn-tint: #2E2516; --bad: #EE8E7E; --bad-tint: #33201C;
    --press: rgba(255,255,255,.07); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3); --scrim: rgba(0,0,0,.6);
    --logo-light: none; --logo-dark: block; color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-padding-top: 80px; scroll-padding-bottom: calc(150px + var(--safe-b)); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button, a, select, label, [role="button"] { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.screen { min-height: 100dvh; }

/* Schermate di accesso */
.auth { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: calc(24px + var(--safe-t)) var(--gut-r) calc(24px + var(--safe-b)) var(--gut-l); }
.auth-card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
.auth-card .logo { width: 220px; height: auto; margin: 0 auto 4px; }
.auth-card .logo.l1 { display: var(--logo-light); } .auth-card .logo.l2 { display: var(--logo-dark); }
.auth-card h1 { font-size: 24px; text-align: center; }
.auth-card p { margin: 0; color: var(--ink-soft); text-align: center; }
.auth-card .sep { display: flex; align-items: center; gap: 12px; color: var(--stone); font-size: 13px; }
.auth-card .sep::before, .auth-card .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.auth-card .links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 10px 0; color: var(--blue); font-weight: 600; cursor: pointer; min-height: 44px; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; text-align: left; }
.msg.err { background: var(--bad-tint); color: var(--bad); }
.msg.ok { background: var(--ok-tint); color: var(--ok); }
.msg.info { background: var(--blue-tint); color: var(--blue-deep); }
.gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; }
.gbtn svg { width: 18px; height: 18px; }

/* Testata */
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); padding-top: var(--safe-t); }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px 0; cursor: pointer; min-height: 44px; }
.brand img { height: 32px; width: auto; }
.brand .l1 { display: var(--logo-light); } .brand .l2 { display: var(--logo-dark); }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { border: 0; background: none; padding: 10px 14px; border-radius: 10px; cursor: pointer; color: var(--ink-soft); font-weight: 500; min-height: 44px; transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
.tab[aria-current="page"] { background: var(--blue-tint); color: var(--blue-deep); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--warn-tint); color: var(--warn); white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync.pend { background: var(--blue-tint); color: var(--blue-deep); }

/* Barra delle sezioni in basso (telefono) */
.bottomnav { display: none; }
@media (max-width: 719px) {
  .tabs { display: none; }
  .top .wrap { min-height: 52px; justify-content: space-between; }
  .brand img { height: 28px; }
  .bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(4, 1fr);
    background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--line); padding: 4px max(4px, env(safe-area-inset-right, 0px)) var(--safe-b) max(4px, env(safe-area-inset-left, 0px)); }
  .bottomnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border: 0; background: none; color: var(--stone); font-size: 11.5px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: color var(--fast) var(--ease), background var(--fast) var(--ease); }
  .bottomnav button svg { width: 24px; height: 24px; }
  .bottomnav button[aria-current="page"] { color: var(--blue); }
  .bottomnav button:active { background: var(--press); }
  body.in-editor .bottomnav { display: none; }
}

main { padding-block: 22px calc(32px + var(--safe-b)); }
@media (max-width: 719px) { main { padding-block: 16px calc(var(--nav-h) + 28px + var(--safe-b)); } body.in-editor main { padding-bottom: calc(110px + var(--safe-b)); } }

/* Bottoni */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; white-space: nowrap; min-height: 44px; min-width: 44px; transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease), opacity var(--fast) var(--ease); }
.btn:active { background: var(--paper-alt); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.primary:active { background: var(--blue-deep); border-color: var(--blue-deep); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:active { background: var(--press); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg, .icon-btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; background: none; border-radius: 10px; cursor: pointer; color: var(--stone); transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
.icon-btn:active { background: var(--press); color: var(--ink); }
.icon-btn.del:active { color: var(--bad); background: var(--bad-tint); }
.icon-btn:disabled { opacity: .3; cursor: default; background: none; }
@media (hover: hover) {
  .btn:hover { border-color: var(--stone); }
  .btn.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
  .btn.ghost:hover, .icon-btn:hover, .tab:hover { background: var(--paper-alt); }
  .icon-btn.del:hover { color: var(--bad); background: var(--bad-tint); }
}

/* Campi: 16px per evitare lo zoom automatico su iPhone */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.in { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; min-height: 46px; font-size: 16px; transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease); }
.in:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-tint); }
textarea.in { resize: vertical; min-height: 84px; line-height: 1.45; }
select.in { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--stone) 50%), linear-gradient(135deg, var(--stone) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; min-height: 44px; }
.check input { accent-color: var(--blue); width: 20px; height: 20px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.card + .card, .card + .sez, .sez + .sez, .sez + .add-sez, .add-sez + .card, .note + .card { margin-top: 14px; }
.card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h2 small { font-family: var(--body); font-weight: 400; color: var(--stone); font-size: 13px; }
.card .help { font-size: 13.5px; color: var(--stone); margin: -8px 0 12px; }
.eyebrow { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--stone); }
@media (max-width: 719px) { .card { padding: 16px; border-radius: 14px; } }

/* Stati */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-bozza { background: var(--paper-alt); color: var(--ink-soft); }
.st-inviato { background: var(--blue-tint); color: var(--blue-deep); }
.st-accettato { background: var(--ok-tint); color: var(--ok); }
.st-rifiutato { background: var(--bad-tint); color: var(--bad); }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--warn-tint); color: var(--warn); font-weight: 600; }
.dup { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--bad-tint); color: var(--bad); font-weight: 600; margin-left: 6px; }

/* Elenco */
.head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.head h1 { font-size: clamp(26px, 5vw, 32px); }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.sum { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; cursor: pointer; text-align: left; transition: background var(--fast) var(--ease); }
.sum:active { background: var(--paper-alt); }
.sum[aria-pressed="true"] { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.sum .k { font-size: 13px; color: var(--ink-soft); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.sum .k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.sum .v { font-family: var(--display); font-size: clamp(18px, 3vw, 24px); font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sum .c { font-size: 13px; color: var(--stone); }
@media (max-width: 719px) {
  .summary { grid-template-columns: 1fr; gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
  .sum { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; border: 0; border-radius: 0; padding: 12px 16px; min-height: 60px; }
  .sum + .sum { border-top: 1px solid var(--line-soft); }
  .sum .k { grid-column: 1; grid-row: 1; } .sum .c { grid-column: 1; grid-row: 2; }
  .sum .v { grid-column: 2; grid-row: 1 / 3; align-self: center; font-size: 18px; }
  .sum[aria-pressed="true"] { box-shadow: inset 3px 0 0 var(--blue); }
}
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .search { flex: 1 1 240px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
@media (max-width: 719px) { .toolbar .chips { width: 100%; } }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; color: var(--ink-soft); white-space: nowrap; min-height: 40px; transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip:active { background: var(--paper-alt); }

.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto 140px; gap: 16px; align-items: center; padding: 14px 18px; border: 0; border-top: 1px solid var(--line-soft); width: 100%; background: none; text-align: left; cursor: pointer; min-height: 64px; transition: background var(--fast) var(--ease); }
.row:first-child { border-top: 0; }
.row:active { background: var(--paper-alt); }
@media (hover: hover) { .row:hover, .li:hover { background: var(--paper); } }
.row .n { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
.row .who { min-width: 0; }
.row .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .who span { display: block; color: var(--stone); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .amt small { display: block; font-weight: 400; color: var(--stone); font-size: 13px; }
@media (max-width: 719px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 16px; }
  .row .n { grid-column: 1; grid-row: 1; } .row .st { grid-column: 2; grid-row: 1; justify-self: end; }
  .row .who { grid-column: 1; grid-row: 2; } .row .amt { grid-column: 2; grid-row: 2; align-self: end; }
}
.empty { padding: 40px 20px; text-align: center; color: var(--ink-soft); }
.empty h3 { font-size: 18px; color: var(--ink); margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }
.skeleton { height: 64px; border-top: 1px solid var(--line-soft); background: linear-gradient(90deg, transparent, var(--paper-alt), transparent); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.skeleton:first-child { border-top: 0; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Editor */
.ed-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.ed-top .ttl { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
.ed-top h1 { font-size: clamp(22px, 4vw, 30px); font-variant-numeric: tabular-nums; }
.savestate { font-size: 13px; color: var(--stone); min-width: 60px; }
.savestate.err { color: var(--bad); }
.ed-actions, .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 719px) {
  .ed-top .back-label { display: none; }
  .ed-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .ed-actions .primary { display: none; }
}
.note { background: var(--blue-tint); color: var(--blue-deep); border-radius: var(--r); padding: 12px 14px; font-size: 14.5px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.note.bad { background: var(--bad-tint); color: var(--bad); }
.note.richiama { width: 100%; border: 0; text-align: left; cursor: pointer; flex-wrap: nowrap; justify-content: flex-start; background: var(--warn-tint); color: var(--warn); }
.note.richiama svg { width: 20px; height: 20px; flex: none; }
.note.richiama span:not(.vedi) { flex: 1; min-width: 0; }
.note.richiama .vedi { font-weight: 600; text-decoration: underline; flex: none; }
.row-wrap { border-top: 1px solid var(--line-soft); }
.row-wrap:first-child { border-top: 0; }
.row-wrap .row { border-top: 0; }
.row-call { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 18px 14px; }
.row-call .btn { flex: 1 1 0; min-height: 44px; text-decoration: none; color: inherit; }
.row .amt small.tardi { color: var(--warn); font-weight: 600; }

.sez { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.sez-h { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 16px; background: var(--paper-alt); border-bottom: 1px solid var(--line); }
.sez-h .sn { font-family: var(--display); font-weight: 700; color: var(--walnut); font-size: 15px; width: 18px; flex: none; }
.sez-h input { flex: 1 1 auto; min-width: 0; border: 1px solid transparent; background: transparent; font-family: var(--display); font-weight: 700; font-size: 16px; padding: 8px; border-radius: 8px; min-height: 44px; }
.sez-h input:focus { border-color: var(--blue); background: var(--card); outline: none; }
.sez-h .st { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sez-h .tools { display: flex; }
.vhead, .voce { display: grid; grid-template-columns: 34px minmax(0, 1fr) 100px 150px 110px 112px 176px; gap: 8px; align-items: start; padding: 8px 12px 8px 16px; }
.vhead { font-size: 11.5px; font-weight: 600; color: var(--stone); text-transform: uppercase; letter-spacing: .06em; padding-block: 8px 4px; }
.vhead .r, .voce .r { text-align: right; }
.voce { border-top: 1px solid var(--line-soft); }
.voce .vn { font-family: var(--mono); font-size: 12px; color: var(--stone); padding-top: 13px; }
.voce textarea { min-height: 46px; resize: none; overflow: hidden; }
.voce .in.r { text-align: right; font-variant-numeric: tabular-nums; }
.voce .imp { text-align: right; font-weight: 600; padding-top: 12px; font-variant-numeric: tabular-nums; }
